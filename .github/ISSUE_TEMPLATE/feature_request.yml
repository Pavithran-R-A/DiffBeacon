name: Feature request
description: Propose a focused improvement to DiffBeacon.
title: 'feature: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the proposal preserves deterministic, observation-first behavior.
    validations:
      required: true
