name: Temporary v0.1.1 finalizer

on:
  push:
    branches:
      - fix/v0.1.1-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/v0.1.1-hardening
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and rebuild tracked artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          npm run build:action
          git rm .github/workflows/finalize-v011.yml
          npm run manifest
          npm run format:check
          git diff --check
      - name: Commit finalizer output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalizer changes required."
            exit 0
          fi
          git commit -m "build: refresh v0.1.1 hardening artifacts"
          git push origin HEAD:fix/v0.1.1-hardening
