name: Deploy browser demo to GitHub Pages

# Dispatched by hand so the commit that goes live is always a commit someone chose; the deployed URL
# is reported by GitHub's own deploy step rather than asserted in prose.
on:
  workflow_dispatch:

# Serialize deployments without cancelling the one already writing the public site. A newer manual
# dispatch waits its turn instead of racing an older artifact and accidentally publishing out of order.
concurrency:
  group: pages
  cancel-in-progress: false

# Permissions are job-scoped: build/test code can read source but cannot mint a Pages OIDC token
# or write a deployment. Only the dedicated deploy job receives the two elevated Pages grants.
jobs:
  build:
    permissions:
      contents: read
    # workflow_dispatch can be pointed at any ref in the UI. Only main is a deployable source;
    # selecting another branch must stop before an artifact or Pages credential is produced.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Source verification is serialized without its embedded browser projects; the dedicated
      # fail-closed Chromium step below owns that surface before the final Pages build.
      DIFFBEACON_SKIP_BROWSER: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Secret scan
        run: npm run secret-scan
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (release surface)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (development tree)
        run: npm audit --audit-level=high
      - name: Verify source, packages and committed artifacts
        run: npm run check
      - name: Qualify the browser before deployment
        env:
          DIFFBEACON_SKIP_BROWSER: '0'
          DIFFBEACON_REQUIRE_BROWSER: '1'
        run: npm run test:browser
      # Browser qualification may build its own local-root fixture; make the deployable bytes last.
      - name: Build the repository-path web bundle
        run: BASE_PATH="/${{ github.event.repository.name }}/" npm run build:web
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Report the deployed URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "deployed_page_url=$PAGE_URL"
          echo "### Deployed at $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
