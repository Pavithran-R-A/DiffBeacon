name: Self-hosted smoke

# Temporary Stage 9 probe: prove that GitHub will dispatch a job to a repository-scoped
# self-hosted runner for this repository. No dependency installation, no secrets, no publish.
#
# The trigger is a push restricted to this probe's own branch, not `workflow_dispatch`. Reason,
# measured: the REST dispatch endpoint answers 404 unless the workflow file exists on the
# repository's default branch (`main`), and this stage is not authorized to change `main`. One
# push creates exactly one run, so the probe is still a single, deliberate invocation.
on:
  push:
    branches:
      - tmp/stage9-selfhosted-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Self-hosted smoke (Windows runner)
    runs-on: [self-hosted, windows, x64, diffbeacon-stage9]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Environment identity
        shell: powershell
        run: |
          Write-Output "computer=$env:COMPUTERNAME"
          Write-Output "runner_name=$env:RUNNER_NAME"
          Write-Output "runner_os=$env:RUNNER_OS"
          Write-Output "runner_arch=$env:RUNNER_ARCH"
          Write-Output "runner_temp=$env:RUNNER_TEMP"
          Write-Output "runner_workspace=$env:RUNNER_WORKSPACE"
          Write-Output "workspace=$env:GITHUB_WORKSPACE"
          Write-Output "shell_ps=$($PSVersionTable.PSVersion)"
          (Get-CimInstance Win32_OperatingSystem | ForEach-Object { "os=$($_.Caption) $($_.Version) $($_.BuildNumber)" })
          node -v
          npm -v
          git --version
          Write-Output "workspace_head=$(git rev-parse HEAD)"

      - name: Sentinel
        shell: powershell
        run: Write-Output "SELF_HOSTED_STAGE9_SMOKE_OK"
