name: CI (self-hosted Stage 9)

# Stage 9 alternative CI lane, authorized because the account's GitHub-hosted Actions allowance is
# exhausted and hosted jobs are allocated no runner at all. This workflow runs the same gates as
# `.github/workflows/ci.yml` on repository-scoped self-hosted runners that carry the
# `diffbeacon-stage9` label. It does not replace `ci.yml`: the hosted contract stays exactly as
# written, and GitHub-hosted runner qualification for this repository remains unqualified.
#
# Correction, measured 2026-10-04. The two premises in the paragraph above were true when Stage 9
# was authorized and are recorded here as that history; neither is the current state. Hosted jobs
# are allocated runners again: `.github/workflows/ci.yml` ran on GitHub-hosted runners, and Actions
# run 37191968216 at commit 889f52b6e53095fea978fafbe50017ff71e543db concluded success for all five
# lanes, including the real-Chromium browser lane. Hosted runner qualification is therefore no
# longer unqualified for what that run executed — see
# docs/audits/stage11-release-qualification.md for its exact width and limits. This lane still does
# not replace `ci.yml`, and the branch trigger and absence of pull-request events below stay as
# written: this machine must never execute untrusted fork code.
#
# Trigger: a push restricted to `rescue/stage9-selfhosted-ci`, plus `workflow_dispatch`. The
# dispatch event alone was measured to be unusable here: `POST
# /repos/{owner}/{repo}/actions/workflows/{file}/dispatches` answers 404 unless the workflow file
# exists on the repository's default branch, and the default branch of this repository is `main`,
# which Stage 9 is not authorized to change. A push to the dedicated branch below is therefore the
# narrowest way to get one deliberate, single invocation of a pinned SHA. Pull-request events are
# absent on purpose: this machine must never execute untrusted fork code.
on:
  push:
    branches:
      - rescue/stage9-selfhosted-ci
  workflow_dispatch:

concurrency:
  group: ci-self-hosted-stage9-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The seven lanes below are chained with `needs:` on purpose. Both runners are the same physical
  # machine, and the Stage 9 local matrix already measured that overlapping lanes starve the Chromium
  # lane; a serialized chain trades wall clock for a result that means what it says.
  linux-node24:
    name: Source self-hosted Linux / Node 24
    runs-on: [self-hosted, linux, x64, diffbeacon-stage9]
    timeout-minutes: 30
    env:
      DIFFBEACON_SKIP_BROWSER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Discard prior job artifacts (this runner's own workspace only)
        run: |
          git clean -ffdx
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Runner and toolchain identity
        run: |
          uname -a
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "runner_workspace=${RUNNER_WORKSPACE}"
          node -v
          npm -v
          git --version
      - name: Assert the requested Node major
        run: |
          node -e 'const major = process.versions.node.split(".")[0]; if (major !== "24") { console.error(`expected Node 24, got ${process.version}`); process.exit(1); } console.log(`node_major_ok=${major}`);'
      - name: Secret scan
        run: npm run secret-scan
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (release surface)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (development tree)
        run: npm audit --audit-level=high
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # `npm run check` already runs the three gates above; they stay as named steps so this lane's
      # log states which gate produced a result instead of leaving it inside one aggregate command.
      - name: Source verification (browser suites suppressed)
        run: npm run check
      - name: Package smoke
        run: npm run package-smoke
      - name: Action smoke
        run: npm run action-smoke
      - name: Action bundle freshness (committed artifact equals rebuild)
        run: git diff --exit-code -- packages/action/dist/index.js
      - name: Workspace cleanliness after gates
        run: |
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  windows-node24:
    name: Source self-hosted Windows / Node 24
    needs: [linux-node24]
    runs-on: [self-hosted, windows, x64, diffbeacon-stage9]
    timeout-minutes: 30
    env:
      DIFFBEACON_SKIP_BROWSER: '1'
    # Windows PowerShell is used because the Git Bash step host cannot be invoked on this machine:
    # the generated step script lives under a profile path containing a space and bash receives it
    # unquoted (measured: `/usr/bin/bash: C:\Users\Pavithran: No such file or directory`). PowerShell
    # does not propagate a native command's exit code, so every gate step ends with an explicit guard.
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Discard prior job artifacts (this runner's own workspace only)
        run: |
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $debris = git status --porcelain --untracked-files=all
          if ($debris) { Write-Error 'workspace is not clean before the build'; exit 1 }
      - name: Runner and toolchain identity
        run: |
          Write-Output "runner_name=$env:RUNNER_NAME"
          Write-Output "runner_os=$env:RUNNER_OS"
          Write-Output "runner_arch=$env:RUNNER_ARCH"
          Write-Output "runner_workspace=$env:RUNNER_WORKSPACE"
          (Get-CimInstance Win32_OperatingSystem | ForEach-Object { "os=$($_.Caption) $($_.Version) build $($_.BuildNumber)" })
          node -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert the requested Node major
        run: |
          $major = (node -p "process.versions.node.split('.')[0]")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($major -ne '24') { Write-Error "expected Node 24, got $major"; exit 1 }
          Write-Output "node_major_ok=$major"
      - name: Secret scan
        run: |
          npm run secret-scan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency audit (release surface)
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency audit (development tree)
        run: |
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format check
        run: |
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source verification (browser suites suppressed)
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package smoke
        run: |
          npm run package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Action smoke
        run: |
          npm run action-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Action bundle freshness (committed artifact equals rebuild)
        run: |
          git diff --exit-code -- packages/action/dist/index.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Workspace cleanliness after gates
        run: |
          git status --short --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $debris = git status --porcelain --untracked-files=all
          if ($debris) { Write-Error 'the build left tracked or untracked debris in the workspace'; exit 1 }

