  browser-windows-node24:
    name: Browser lane (self-hosted Windows / Node 24)
    needs: [linux-node22]
    runs-on: [self-hosted, windows, x64, diffbeacon-stage9]
    timeout-minutes: 45
    env:
      DIFFBEACON_REQUIRE_BROWSER: '1'
    # PLATFORM DEVIATION, recorded rather than hidden: the release browser contract is
    # ubuntu-latest / Node 24. This repository's WSL2 Ubuntu runner has no Chromium-class engine
    # (measured: `google-chrome`, `chromium` and `chromium-browser` are all absent) and the harness
    # locates an existing engine instead of downloading one, so the real-browser lane runs on the
    # Windows self-hosted runner. Windows Chromium qualifies the engine and the 132 cases; it does
    # not qualify the Linux hosted-browser cell.
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Discard prior job artifacts (this runner's own workspace only)
        run: |
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $debris = git status --porcelain --untracked-files=all
          if ($debris) { Write-Error 'workspace is not clean before the build'; exit 1 }
      - name: Runner identity and located browser engine
        run: |
          Write-Output "runner_name=$env:RUNNER_NAME"
          Write-Output "runner_os=$env:RUNNER_OS"
          Write-Output "engine_search=$env:LOCALAPPDATA\ms-playwright"
          Get-ChildItem "$env:LOCALAPPDATA\ms-playwright" -Name
          node -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert the requested Node major
        run: |
          $major = (node -p "process.versions.node.split('.')[0]")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($major -ne '24') { Write-Error "expected Node 24, got $major"; exit 1 }
          Write-Output "node_major_ok=$major"
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Secret scan
        run: |
          npm run secret-scan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser suites (real Chromium required)
        run: |
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Workspace cleanliness after the lane
        run: |
          git status --short --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $debris = git status --porcelain --untracked-files=all
          if ($debris) { Write-Error 'the browser lane left debris in the workspace'; exit 1 }

  package-linux-node24:
    name: Package lane (self-hosted Linux / Node 24)
    needs: [browser-windows-node24]
    runs-on: [self-hosted, linux, x64, diffbeacon-stage9]
    timeout-minutes: 30
    env:
      DIFFBEACON_SKIP_BROWSER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Discard prior job artifacts (this runner's own workspace only)
        run: |
          git clean -ffdx
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Runner and toolchain identity
        run: |
          uname -a
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          node -v
          npm -v
          git --version
      - name: Assert the requested Node major
        run: |
          node -e 'const major = process.versions.node.split(".")[0]; if (major !== "24") { console.error(`expected Node 24, got ${process.version}`); process.exit(1); } console.log(`node_major_ok=${major}`);'
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Pack the release surface
        run: |
          mkdir -p "${RUNNER_TEMP}/stage9-pack"
          npm pack ./packages/cli --pack-destination "${RUNNER_TEMP}/stage9-pack"
          tar -tzf "${RUNNER_TEMP}"/stage9-pack/diffbeacon-*.tgz | sort
      - name: Install the exact tarball into a clean consumer
        run: |
          mkdir -p "${RUNNER_TEMP}/stage9-consumer"
          cd "${RUNNER_TEMP}/stage9-consumer"
          printf '{"name":"diffbeacon-consumer","version":"1.0.0","private":true}\n' >package.json
          npm install --no-audit --no-fund "${RUNNER_TEMP}"/stage9-pack/diffbeacon-*.tgz
          ./node_modules/.bin/diffbeacon --version
          ./node_modules/.bin/diffbeacon --help
      - name: Workspace cleanliness after the lane
        run: |
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  package-windows-node24:
    name: Package lane (self-hosted Windows / Node 24)
    needs: [package-linux-node24]
    runs-on: [self-hosted, windows, x64, diffbeacon-stage9]
    timeout-minutes: 30
    env:
      DIFFBEACON_SKIP_BROWSER: '1'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Discard prior job artifacts (this runner's own workspace only)
        run: |
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $debris = git status --porcelain --untracked-files=all
          if ($debris) { Write-Error 'workspace is not clean before the build'; exit 1 }
      - name: Runner and toolchain identity
        run: |
          Write-Output "runner_name=$env:RUNNER_NAME"
          Write-Output "runner_os=$env:RUNNER_OS"
          node -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert the requested Node major
        run: |
          $major = (node -p "process.versions.node.split('.')[0]")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($major -ne '24') { Write-Error "expected Node 24, got $major"; exit 1 }
          Write-Output "node_major_ok=$major"
      - name: Install dependencies and build
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack the release surface
        # On a Windows runner that has Git for Windows installed, `tar` resolves to
        # C:\Program Files\Git\usr\bin\tar.exe (GNU tar) instead of System32's bsdtar. GNU tar reads the
        # `C:` of an absolute Windows path as an rsh host and aborts with `Cannot connect to C: resolve
        # failed` (measured: run 36556147020 attempt 2; reproduced locally with the same error text).
        # Listing from inside the pack directory with a bare relative name works with either tar, so the
        # gate does not depend on which one PATH happens to resolve.
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'stage9-pack'
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          npm pack ./packages/cli --pack-destination $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "tar=$((Get-Command tar.exe).Source)"
          $tarballs = @(Get-ChildItem $pack -Filter 'diffbeacon-*.tgz')
          if ($tarballs.Count -ne 1) {
            Write-Error "expected exactly one tarball, found $($tarballs.Count)"
            exit 1
          }
          Write-Output "tarball=$($tarballs[0].FullName)"
          Push-Location $pack
          tar -tzf $tarballs[0].Name
          $tarExit = $LASTEXITCODE
          Pop-Location
          if ($tarExit -ne 0) { exit $tarExit }
      - name: Install the exact tarball into a clean consumer
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP 'stage9-consumer'
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          $pack = Join-Path $env:RUNNER_TEMP 'stage9-pack'
          $tarball = (Get-ChildItem $pack -Filter 'diffbeacon-*.tgz').FullName
          Set-Location $consumer
          '{"name":"diffbeacon-consumer","version":"1.0.0","private":true}' | Set-Content -Encoding ascii package.json
          npm install --no-audit --no-fund $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $consumer 'node_modules\.bin\diffbeacon.cmd') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $consumer 'node_modules\.bin\diffbeacon.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Workspace cleanliness after the lane
        run: |
          git status --short --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $debris = git status --porcelain --untracked-files=all
          if ($debris) { Write-Error 'the package lane left a tarball or debris in the workspace'; exit 1 }
