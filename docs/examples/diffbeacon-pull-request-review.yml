# DiffBeacon GitHub Action — consumer example.
#
# NOT A WORKFLOW GITHUB RUNS FROM THIS REPOSITORY. This file is documentation kept outside
# `.github/workflows/` on purpose: it is the reference a *consumer* copies into their own
# repository. What it references is a reviewed, published release rather than an unfilled slot —
# `v0.1.0` exists, and the commit named below is the release commit it points at.
#
# Why the reference is a full commit SHA:
#
#   - The Action you run and the repository it reads are two different trust domains.
#     `actions/checkout` copies the pull request into the runner; DiffBeacon then reads that
#     copy as data through `git diff`.
#   - `uses: ./` would load `action.yml` from that copy, letting the reviewed change choose and
#     run the reviewer implementation. GitHub normally protects fork pull requests with a
#     read-only `GITHUB_TOKEN` and withheld secrets, but DiffBeacon's rule is stricter and does
#     not depend on token scope: the repository under review is data, never code that runs. That
#     is why the example below references DiffBeacon independently, by immutable full commit SHA.
#   - `pull_request_target` is not a fix. It runs the base branch's workflow in the base
#     repository's context, where the default checkout is the base branch, and that extra trust is
#     precisely why workflows go wrong there by checking out the pull request's code themselves.
#     DiffBeacon has no use for the trigger and refuses the event outright.
#
# Provenance of each pin:
#
#   - `3d3c42e5aac5ba805825da76410c181273ba90b1` was checked against `refs/tags/v7` of
#     https://github.com/actions/checkout with `git ls-remote --tags` on 2026-09-26, and is the
#     same pin this repository's own CI uses. Re-verify before replacing it.
#   - `5a50b52028ead78942ea3fc3bee93ba26e0a79cc` is the commit the annotated `v0.1.0` tag peels to,
#     verified with `git ls-remote` on 2026-10-06. That commit is what a release is pinned to; a
#     moving major tag was deliberately not created, so the SHA below is the recommended reference
#     rather than a stricter alternative to a convenient one. See
#     `docs/audits/stage14-v0.1.0-consumer-release.md` for the consumer run that exercised it.
name: DiffBeacon review
on:
  pull_request:
permissions:
  contents: read
jobs:
  attention:
    runs-on: ubuntu-latest
    steps:
      # Full history: the default shallow checkout is not guaranteed to contain the pull
      # request's base commit, and DiffBeacon resolves `base...head` locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # DiffBeacon performs no authenticated Git operation after checkout, so the
          # runner's credentials do not need to persist into the steps that read PR code.
          # No PAT, no secret, and no pull-request write permission is required or used.
          persist-credentials: false
      # The step needs no `with:` inputs: DiffBeacon reads the event the runner delivered and
      # writes its review to the Job Summary, which is the Action's only v0.1 output.
      - uses: Pavithran-R-A/DiffBeacon@5a50b52028ead78942ea3fc3bee93ba26e0a79cc
